[package]
name = "tcgtycoon-desktop"
version = "0.1.0"
description = "TCGTycoon desktop shell"
edition = "2021"

[lib]
name = "tcgtycoon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
